# ════════════════════════════════════════════════════════════════════════════
#  Waveshare ESP32-S3-LCD-1.47 – Segment LCD Clock  (landscape 320×172)
#  Hand-drawn 7-segment rectangles with per-segment slide animation
#  Arc gauge for seconds  ·  Day/night theme  ·  DSEG7 font only for arc label
# ════════════════════════════════════════════════════════════════════════════
#
#  Digit geometry (54 wide × 107 tall, origin by=30):
#    seg A (top-H):    bx+6,  by+0,   w=42, h=5
#    seg B (top-R-V):  bx+49, by+6,   w=5,  h=44
#    seg C (bot-R-V):  bx+49, by+57,  w=5,  h=44
#    seg D (bot-H):    bx+6,  by+102, w=42, h=5
#    seg E (bot-L-V):  bx+0,  by+57,  w=5,  h=44
#    seg F (top-L-V):  bx+0,  by+6,   w=5,  h=44
#    seg G (mid-H):    bx+6,  by+51,  w=42, h=5
#
#  Digit origins (bx): H0=4  H1=62  |colon=118-134|  M0=136  M1=194
#  Colon dots: x=120, top-dot y=55, bot-dot y=100, size 12×12, radius 6
#  Arc: x=253 y=52, 58×58, centre=(282,81)
#  Bar: y=160, x=4 to x=308

esphome:
  name: waveshare-clock
  friendly_name: Waveshare Clock
  includes:
    - clock_helper.h
    - provisioning.h
    - qr_helper.h
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - delay: 500ms
      - if:
          condition:
            lambda: return prov_needs_setup();
          then:
            - lvgl.page.show: setup_page
            - lambda: |-
                draw_wifi_qr(id(qr_placeholder));
                lv_refr_now(NULL);
                prov_start();
          else:
            - lambda: |-
                // Load all persisted settings
                g_theme_idx  = prov_get_theme();
                g_use_24h    = prov_get_24h();
                g_tz_idx     = prov_get_tz_idx();
                int nm       = prov_get_night_mode();
                g_night_auto = (nm == 0);
                if (nm == 1) g_is_day = true;
                if (nm == 2) g_is_day = false;
                apply_tz();
                prov_connect_wifi();
                settings_start();
            - lvgl.page.show: clock_page
            - lambda: |-
                seg_init(0,
                  id(s_h0_a),id(s_h0_b),id(s_h0_c),id(s_h0_d),id(s_h0_e),id(s_h0_f),id(s_h0_g),
                  id(g_h0_a),id(g_h0_b),id(g_h0_c),id(g_h0_d),id(g_h0_e),id(g_h0_f),id(g_h0_g));
                seg_init(1,
                  id(s_h1_a),id(s_h1_b),id(s_h1_c),id(s_h1_d),id(s_h1_e),id(s_h1_f),id(s_h1_g),
                  id(g_h1_a),id(g_h1_b),id(g_h1_c),id(g_h1_d),id(g_h1_e),id(g_h1_f),id(g_h1_g));
                seg_init(2,
                  id(s_m0_a),id(s_m0_b),id(s_m0_c),id(s_m0_d),id(s_m0_e),id(s_m0_f),id(s_m0_g),
                  id(g_m0_a),id(g_m0_b),id(g_m0_c),id(g_m0_d),id(g_m0_e),id(g_m0_f),id(g_m0_g));
                seg_init(3,
                  id(s_m1_a),id(s_m1_b),id(s_m1_c),id(s_m1_d),id(s_m1_e),id(s_m1_f),id(s_m1_g),
                  id(g_m1_a),id(g_m1_b),id(g_m1_c),id(g_m1_d),id(g_m1_e),id(g_m1_f),id(g_m1_g));
                colon_init(id(col_a), id(col_b));
                seg_set(0, 1, false);
                seg_set(1, 2, false);
                seg_set(2, 3, false);
                seg_set(3, 4, false);
                lv_label_set_text(id(lbl_sec_digits), "00");
                apply_current_theme(
                  id(clock_screen), id(date_header),
                  id(lbl_date), id(lbl_ampm),
                  id(sec_bar_bg), id(sec_bar_fg),
                  id(sec_arc), id(lbl_sec_digits));
                lv_arc_set_value(id(sec_arc), 0);
                lv_label_set_text(id(lbl_date), "v" CLOCK_VERSION "  -  Connecting...");
                g_boot_pulsing = true;
                lv_refr_now(NULL);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

globals:
  - id: g_btn_press_ms
    type: uint32_t
    initial_value: '0'
  - id: g_btn_cycles_done
    type: uint32_t
    initial_value: '0'
  - id: g_toast_ms
    type: uint32_t
    initial_value: '0'
  - id: g_boot_sec
    type: uint8_t
    initial_value: '0'

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ap:
    ssid: "WaveShare-Clock"
    password: ""
  reboot_timeout: 0s
  on_connect:
    - lambda: |-
        if (!g_provisioning)
          lv_label_set_text(id(lbl_date), "Syncing time...");
  on_disconnect:
    - lambda: |-
        if (!g_provisioning && id(clock_time).now().is_valid())
          lv_label_set_text(id(lbl_date), "Reconnecting...");

time:
  - platform: sntp
    id: clock_time
    timezone: "America/Los_Angeles"
    servers:
      - pool.ntp.org
      - time.cloudflare.com

# ── Fonts (DSEG7 only for arc seconds readout) ────────────────────────────────
font:
  - file: "dseg/fonts-DSEG_v046/DSEG7-Classic/DSEG7Classic-Regular.ttf"
    id: font_seg_sm
    size: 26
    glyphs: "0123456789"

  - file: "gfonts://Roboto"
    id: font_m
    size: 13
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :./-(),"

  - file: "gfonts://Roboto"
    id: font_s
    size: 11
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :./-(),"

spi:
  clk_pin:  GPIO40
  mosi_pin: GPIO45

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO48

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO38
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

display:
  - platform: ili9xxx
    id: waveshare_display
    model: ST7789V
    cs_pin:    GPIO42
    dc_pin:    GPIO41
    reset_pin: GPIO39
    rotation: 90
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

# ── Clock tick ────────────────────────────────────────────────────────────────
interval:
  # 200 ms poll: live color preview while button is held ≥ 1.5 s
  - interval: 200ms
    then:
      - lambda: |-
          if (g_provisioning || !id(nav_btn).state) return;
          uint32_t held = millis() - id(g_btn_press_ms);
          if (held < 1500) return;
          uint32_t next_cycle = id(g_btn_press_ms) + 1500
                              + id(g_btn_cycles_done) * 2000;
          if (millis() < next_cycle) return;
          cycle_theme();
          apply_current_theme(
            id(clock_screen), id(date_header),
            id(lbl_date), id(lbl_ampm),
            id(sec_bar_bg), id(sec_bar_fg),
            id(sec_arc), id(lbl_sec_digits));
          id(g_btn_cycles_done) = id(g_btn_cycles_done) + 1;

  - interval: 1s
    then:
      - lambda: |-
          // Reset LVGL idle timer every second → backlight never times out
          lv_disp_trig_activity(NULL);

          if (g_provisioning) return;

          // Apply any settings changed via web UI
          if (g_settings_changed) {
            g_settings_changed = 0;
            g_theme_idx = prov_get_theme();
            g_use_24h   = prov_get_24h();
            int tz      = prov_get_tz_idx();
            if (tz != g_tz_idx) { g_tz_idx = tz; apply_tz(); }
            int nm = prov_get_night_mode();
            g_night_auto = (nm == 0);
            if (nm == 1) g_is_day = true;
            if (nm == 2) g_is_day = false;
            apply_current_theme(
              id(clock_screen), id(date_header),
              id(lbl_date), id(lbl_ampm),
              id(sec_bar_bg), id(sec_bar_fg),
              id(sec_arc), id(lbl_sec_digits));
          }

          auto t = id(clock_time).now();
          static uint32_t s_sync_err_start = 0;
          if (!t.is_valid()) {
            if (!s_sync_err_start) s_sync_err_start = millis();
            uint32_t elapsed = millis() - s_sync_err_start;
            if (elapsed > 45000)
              lv_label_set_text(id(lbl_date), "No WiFi  -  Visit 1.2.3.4");
            // Boot animation — only after on_boot has set g_boot_pulsing = true
            if (g_boot_pulsing) {
              lv_obj_invalidate(id(clock_screen));
              id(g_boot_sec) = (id(g_boot_sec) + 1) % 60;
              {
                char bsec[3];
                snprintf(bsec, sizeof(bsec), "%02d", (int)id(g_boot_sec));
                lv_label_set_text(id(lbl_sec_digits), bsec);
              }
              lv_arc_set_value(id(sec_arc), id(g_boot_sec));
              colon_set(id(g_boot_sec) % 2 == 0);
            }
            return;
          }
          g_boot_pulsing = false;
          s_sync_err_start = 0;
          int h = t.hour, m = t.minute, s = t.second;

          // Day/night (auto or forced)
          bool want_day = g_night_auto ? (h >= 6 && h < 20) : g_is_day;
          if (want_day != g_is_day) {
            g_is_day = want_day;
            apply_current_theme(
              id(clock_screen), id(date_header),
              id(lbl_date), id(lbl_ampm),
              id(sec_bar_bg), id(sec_bar_fg),
              id(sec_arc), id(lbl_sec_digits));
          }

          // Hide toast after 2.5 s
          if (id(g_toast_ms) && (millis() - id(g_toast_ms) > 2500)) {
            id(g_toast_ms) = 0;
            lv_obj_set_style_opa(id(lbl_toast), LV_OPA_TRANSP, LV_PART_MAIN);
          }

          // Full-screen invalidation each tick — forces LVGL to repaint
          // from a clean slate, eliminating all AA dirty-region ghost pixels.
          lv_obj_invalidate(id(clock_screen));

          int disp_h = g_use_24h ? h : (h % 12 == 0 ? 12 : h % 12);
          int h12 = disp_h;
          seg_set(0, h12 / 10, true);
          seg_set(1, h12 % 10, true);
          seg_set(2, m  / 10,  true);
          seg_set(3, m  % 10,  true);

          colon_set(s % 2 == 0);

          // Seconds: label + arc ring (label has transparent bg, so arc AA
          // pixels always blend against static background — no smearing).
          lv_arc_set_value(id(sec_arc), s);
          {
            char ssec[3];
            snprintf(ssec, sizeof(ssec), "%02d", s);
            lv_label_set_text(id(lbl_sec_digits), ssec);
          }

          // AM/PM — update only on change to avoid a needless per-second repaint
          {
            const char* ap = g_use_24h ? "" : (h < 12 ? "AM" : "PM");
            if (strcmp(lv_label_get_text(id(lbl_ampm)), ap) != 0)
              lv_label_set_text(id(lbl_ampm), ap);
          }

          // Full spelled-out date
          char db[40];
          static const char* day_names[] = {
            "Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"};
          static const char* mon_names[] = {
            "January","February","March","April","May","June",
            "July","August","September","October","November","December"};
          snprintf(db, sizeof(db), "%s, %s %d",
            day_names[t.day_of_week-1], mon_names[t.month-1], t.day_of_month);
          lv_label_set_text(id(lbl_date), db);

          // Seconds bar
          int bw = (s * 304) / 59;
          lv_obj_set_width(id(sec_bar_fg), bw);

          // LED breathe
          float br = 0.06f + 0.03f*(float)(s % 10)/9.0f;
          auto call = id(status_led).make_call();
          call.set_state(true);
          if (g_is_day) call.set_rgb(0.08f*br*10, 0.18f*br*10, 0.43f*br*10);
          else          call.set_rgb(0.29f*br*10, 0.56f*br*10, 0.91f*br*10);
          call.perform();

# ── Button (BOOT/IO0) – short press = cycle TZ, long press = cycle theme ──────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: nav_btn
    filters:
      - delayed_on:  30ms
      - delayed_off: 30ms
    on_press:
      then:
        - lambda: |-
            id(g_btn_press_ms) = millis();
            id(g_btn_cycles_done) = 0;
    on_release:
      then:
        - lambda: |-
            if (g_provisioning) return;
            uint32_t held = millis() - id(g_btn_press_ms);
            if (held < 30) return;

            if (held >= 1500) {
              // Long hold → color was previewed live; just save whatever's current
              prov_save_theme(g_theme_idx);
            } else {
              // Short press:
              // - if toast is already showing → cycle TZ
              // - otherwise → show current TZ + "Hold for Colors" hint
              char tz_buf[64];
              if (id(g_toast_ms) && millis() - id(g_toast_ms) < 2500) {
                cycle_tz();
                prov_save_tz_idx(g_tz_idx);
                snprintf(tz_buf, sizeof(tz_buf), "%s  %d/%d",
                         TZ_LABELS[g_tz_idx], g_tz_idx + 1, NUM_TZ);
              } else {
                snprintf(tz_buf, sizeof(tz_buf), "%s  %d/%d\nHold for Colors",
                         TZ_LABELS[g_tz_idx], g_tz_idx + 1, NUM_TZ);
              }
              lv_label_set_text(id(lbl_toast), tz_buf);
              lv_obj_set_style_opa(id(lbl_toast), LV_OPA_COVER, LV_PART_MAIN);
              id(g_toast_ms) = millis();
            }

# ════════════════════════════════════════════════════════════════════════════
