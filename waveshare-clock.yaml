    - waveshare_display
  color_depth: 16
  bg_color: 0xEDE8DB
  default_font: font_m
  resume_on_input: false

  pages:
    - id: clock_page
      widgets:

        # ── Full-screen background ────────────────────────────────────────────
        - obj:
            id: clock_screen
            x: 0
            y: 0
            width: 320
            height: 172
            bg_color: 0xEDE8DB
            bg_opa: 100%
            border_width: 0
            pad_all: 0
            radius: 0

            widgets:

              # ── Date header ───────────────────────────────────────────────
